[package]
name = "morivault"
version = "0.2.0"
description = "Safora encrypted password vault"
authors = ["Safora"]
edition = "2021"

[lib]
name = "morivault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
